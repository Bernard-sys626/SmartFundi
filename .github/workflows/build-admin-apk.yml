name: Build SmartFundi Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["admin_app/**", "packages/**", "tools/**", ".github/workflows/build-admin-apk.yml"]
    tags: ["admin-v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing secret API_BASE_URL (example: https://smartfundi-api.onrender.com/api)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.x"
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name smartfundi_admin --org tz.smartfundi .
          rm -rf test
          python3 ../tools/patch_android.py android --label "SmartFundi Admin" --app-id tz.smartfundi.admin

      - name: Install packages and app icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk ../SmartFundi-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFundi-Admin-apk
          path: SmartFundi-Admin.apk

      - name: Attach APK to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/admin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartFundi-Admin.apk
