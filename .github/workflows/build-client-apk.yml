name: Build SmartFundi (Client + Fundi/Company) APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["client_app/**", "packages/**", "tools/**", ".github/workflows/build-client-apk.yml"]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_app
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing secret API_BASE_URL (example: https://smartfundi-api.onrender.com/api)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.x"
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name smartfundi --org tz.smartfundi .
          rm -rf test
          python3 ../tools/patch_android.py android --label "SmartFundi" --app-id tz.smartfundi.smartfundi

      - name: Install packages and app icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk ../SmartFundi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartFundi-apk
          path: SmartFundi.apk

      - name: Attach APK to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartFundi.apk
