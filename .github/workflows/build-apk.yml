name: Build Android APKs

# Builds two apps from the same code base:
#   SmartFundi        (Client + Fundi/Company)  entry point lib/main.dart
#   SmartFundi Admin  (administrators only)     entry point lib/main_admin.dart
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "tools/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SmartFundi
            target: lib/main.dart
            app_id: tz.smartfundi.smartfundi
            label: SmartFundi
            icons: flutter_launcher_icons.yaml
            push: "true"
          - name: SmartFundi-Admin
            target: lib/main_admin.dart
            app_id: tz.smartfundi.admin
            label: SmartFundi Admin
            icons: flutter_launcher_icons-admin.yaml
            push: "false"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing secret API_BASE_URL (example: https://smartfundi-api.onrender.com/api)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.x"
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name smartfundi --org tz.smartfundi .
          rm -rf test
          python3 ../tools/patch_android.py android --label "${{ matrix.label }}" --app-id "${{ matrix.app_id }}"
          
      - name: Optimize Gradle download
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          s = s.replace("-all.zip", "-bin.zip")

          if "networkTimeout=" not in s:
              s += "\nnetworkTimeout=120000\n"

          p.write_text(s)
          print("Gradle download optimized successfully")
          PY


      - name: Install packages and app icon
        run: |
          flutter pub get
          if [ "${{ matrix.icons }}" = "flutter_launcher_icons.yaml" ]; then
            dart run flutter_launcher_icons
          else
            dart run flutter_launcher_icons -f "${{ matrix.icons }}"
          fi

      - name: Build release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          FIREBASE_API_KEY: ${{ matrix.push == 'true' && secrets.FIREBASE_API_KEY || '' }}
          FIREBASE_APP_ID: ${{ matrix.push == 'true' && secrets.FIREBASE_APP_ID || '' }}
          FIREBASE_SENDER_ID: ${{ matrix.push == 'true' && secrets.FIREBASE_SENDER_ID || '' }}
          FIREBASE_PROJECT_ID: ${{ matrix.push == 'true' && secrets.FIREBASE_PROJECT_ID || '' }}
        run: |
          flutter build apk --release -t "${{ matrix.target }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk "../${{ matrix.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: ${{ matrix.name }}.apk

      - name: Attach APK to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.apk
